# WebTS with Docker Compose. Copy .env.example to .env, fill it in, then: docker compose up -d
# Put it behind a sign-in (README: "Access"); never publish it to the internet without one unless you mean to.
services:
  webts:
    # The published image: "1" follows every 1.x release (new features and fixes, nothing that breaks your setup).
    # Pin an exact version such as 1.0.0 if you'd rather update by hand.
    image: ghcr.io/korppujauho/webts:1
    # To build from this folder's code instead, comment out the image line above, uncomment these two, and start
    # with: docker compose up -d --build
    # build: .
    # image: webts:local
    container_name: webts
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:3002:3002"   # only this computer; your reverse proxy or tunnel reaches it here
    volumes:
      - ./data:/app/data          # TeamSpeak identities, saved settings and the chat history: keep and back up
      - ./sounds:/app/sounds:ro   # optional: TeamSpeak's UI sounds (README: "Sounds")
      # Several servers (README: "Several servers"): create servers.json first, then uncomment.
      # - ./servers.json:/app/servers.json:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
