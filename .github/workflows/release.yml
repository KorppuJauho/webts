name: Release
# Publishing a GitHub release (tag vX.Y.Z) builds and publishes the image ghcr.io/korppujauho/webts, after the same
# checks as every PR, a start-up test and a vulnerability scan. "Run workflow" rebuilds an existing release's tag.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to (re)build, e.g. v1.0.0
        required: true
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
env:
  IMAGE: ghcr.io/korppujauho/webts
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: The tag is a version and matches package.json
        run: |
          echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' || { echo "Tag $TAG isn't like v1.2.3"; exit 1; }
          version="v$(node -p "require('./package.json').version")"
          [ "$version" = "$TAG" ] || { echo "package.json says $version, the tag is $TAG"; exit 1; }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Every page script parses
        run: for f in public/*.js; do node --check "$f"; done

  image:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write      # push the image
      id-token: write      # sign the build record
      attestations: write  # store it with the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Image tags (1.2.3, 1.2, 1, latest; a pre-release like 1.3.0-rc.1 gets only its own)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=semver,pattern={{major}},value=${{ env.TAG }}
            type=raw,value=latest,enable=${{ !contains(env.TAG, '-') }}

      # First a local x86 build to test: it must start, and have no serious known vulnerability that has a fix.
      - name: Build for testing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: webts:release-test
          build-args: VERSION=${{ steps.meta.outputs.version }}
      - name: The image starts and serves the page
        run: sh scripts/smoke-test.sh webts:release-test
      - name: Vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: webts:release-test
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish (x86 and ARM)
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          provenance: mode=max
          sbom: true
      - name: Signed build record
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
